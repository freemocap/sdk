[project]
name = "freemocap-sdk-stream"
version = "0.1.0.dev0"
description = "FreeMoCap self-describing CBOR frames and asynchronous WebSocket delivery"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["cbor2>=5.6", "numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freemocap_sdk"]
