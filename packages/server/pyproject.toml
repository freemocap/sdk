[project]
name = "freemocap-sdk-server"
version = "0.1.0.dev0"
description = "Composable server and self-describing transport for FreeMoCap applications"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13", "cbor2>=5.6", "numpy>=1.26", "pydantic>=2", "pyarrow>=18"]

[project.optional-dependencies]
bundle = ["pyinstaller>=6.11"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freemocap_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
